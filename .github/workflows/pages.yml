name: Deploy site to GitHub Pages

# 只在站点内容或本工作流本身变化时触发，避免每次改脚本都重跑一次部署。
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# GitHub Pages 官方部署所需的最小权限。
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，不取消正在进行的那次（避免发布出半个站点）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.pages.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 仓库首次使用本工作流时，Pages 还没启用，这一步会失败。
      # 这里不让它中断整个流程，而是在下面给出明确的提示，
      # 否则 Actions 页面会一直是一片红色 ✗，看不出真正的原因。
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: 提示：Pages 尚未启用
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning title=Pages 尚未启用::请到仓库 Settings -> Pages，把 Source 选为 'GitHub Actions'，然后重新运行本工作流。开启之后，以后每次改动 site/ 都会自动更新在线版。"

      - name: Upload site/ as Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
